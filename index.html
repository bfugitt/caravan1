<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caravan and Sea Routes</title>
<style>
  :root {
    --ink: #1f2430; --muted: #566074; --indigo: #26334d; --indigo2: #3a4d75; --gold: #d9a441; --gold-dk: #8a5d10;
    --paper: #f5f0e4; --card: #fffdf7; --line: #d9cfb4; --sea: #cfe3ea; --land: #eee4c8;
    --good: #2f7d4a; --bad: #a3401d; --head: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --body: Verdana, Tahoma, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.55 var(--body); }
  #app { max-width: 1280px; margin: 0 auto; padding: 14px; }
  h1, h2, h3 { font-family: var(--head); line-height: 1.2; margin: 0 0 .4em; }
  h1 { font-size: 2.4rem; color: var(--indigo); } h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; }
  p { margin: 0 0 .8em; max-width: 72ch; } .lead { font-family: var(--head); font-size: 1.3rem; color: var(--gold-dk); }
  .muted { color: var(--muted); font-size: .92rem; } small { display: block; color: var(--muted); font-size: .78rem; line-height: 1.25; }
  code { background: #ece4cc; padding: 1px 5px; border-radius: 4px; }
  .titlewrap { max-width: 980px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin: 12px 0; }
  .card.big { padding: 20px 24px; } .card.flush { padding: 8px; }
  .era { font-size: .85rem; letter-spacing: .04em; text-transform: uppercase; color: var(--gold-dk); margin-bottom: .3em; }
  .say { color: var(--muted); font-style: italic; }
  .note { background: #e8edf5; border-left: 6px solid var(--indigo2); border-radius: 0 8px 8px 0; padding: 10px 16px; margin: 14px 0; }
  .lesson { background: #fbf1d6; border-left: 6px solid var(--gold); padding: 10px 14px; border-radius: 0 8px 8px 0; }
  .banner { background: #e4efe6; border: 1px solid #b9d3c0; border-radius: 8px; padding: 8px 14px; }
  .banner.warn { background: #f8e6df; border-color: #e1b8a6; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; } .row.wrap { flex-wrap: wrap; justify-content: flex-start; }
  .btn { font: inherit; font-weight: bold; min-height: 46px; padding: 8px 18px; border-radius: 10px; border: 2px solid var(--indigo); background: #fff; color: var(--indigo); cursor: pointer; }
  .btn.primary { background: var(--indigo); color: #fff; } .btn.ghost { border-color: var(--line); color: var(--ink); background: transparent; }
  .btn.small { min-height: 38px; padding: 4px 12px; font-size: .9rem; } .btn.tiny { min-height: 34px; padding: 2px 9px; font-size: .82rem; }
  .btn.alt { border-color: var(--gold-dk); color: var(--gold-dk); }
  .btn:hover:not(:disabled) { background: var(--indigo2); color: #fff; border-color: var(--indigo2); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 4px solid #e0a100; outline-offset: 2px; }
  .status { display: flex; gap: 10px 26px; align-items: center; flex-wrap: wrap; background: var(--indigo); color: #fff; border-radius: 12px; padding: 10px 18px; }
  .status .k { display: block; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: #c5cde0; } .status strong { font-size: 1.15rem; }
  .status .here strong { font-family: var(--head); font-size: 1.4rem; color: var(--gold); } .status .btns { margin-left: auto; display: flex; gap: 8px; }
  .status .btn { background: transparent; color: #fff; border-color: #6b7ca3; } .status .btn:hover:not(:disabled) { background: #6b7ca3; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0 14px; align-items: start; }
  @media (max-width: 1000px) { .cols { grid-template-columns: 1fr; } }
  .map { width: 100%; height: auto; display: block; border-radius: 8px; }
  .map .sea { fill: var(--sea); } .map .land { fill: var(--land); stroke: #c9b98f; stroke-width: 1; }
  .map .lbl-sea { font: italic 13px var(--body); fill: #5a7f93; } .map .lbl-land { font: 11px var(--body); fill: #a89a72; letter-spacing: 2px; }
  .map .route { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
  .map .land-route { stroke: #8a5a2b; stroke-dasharray: 2 6; } .map .sea-route { stroke: #2a6f93; stroke-dasharray: 8 6; }
  .map .route.active { stroke-width: 4.5; opacity: 1; }
  .map .city circle { fill: #fff; stroke: var(--indigo); stroke-width: 3; } .map .city.seen circle { fill: var(--gold); }
  .map .city.here circle { fill: var(--gold); stroke: #7a1f12; stroke-width: 4; }
  .map .city.reach { cursor: pointer; } .map .city.reach circle { stroke: #b4472a; stroke-width: 4; }
  .map .city.reach:hover circle, .map .city.reach:focus circle { fill: #ffd98a; }
  .map .pin { font-size: 22px; text-anchor: middle; } .map .lbl-city { font: bold 14px var(--head); fill: var(--ink); paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
  .legend { margin: 6px 4px 2px; font-size: .82rem; color: var(--muted); } .lg { display: inline-block; width: 26px; height: 0; border-top: 3px dashed; margin: 0 4px 3px 10px; vertical-align: middle; }
  .lg.land-route { border-color: #8a5a2b; } .lg.sea-route { border-color: #2a6f93; }
  .trips { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 8px; }
  .trip { width: 100%; font: inherit; text-align: left; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; padding: 10px 14px; border-radius: 10px; border: 2px solid var(--indigo2); background: #fff; color: var(--ink); cursor: pointer; }
  .trip:hover:not(:disabled) { background: #eef2fa; } .trip:disabled { opacity: .55; cursor: not-allowed; } .trip strong { font-size: 1.05rem; color: var(--indigo); }
  .chip { display: inline-block; font-size: .74rem; font-weight: bold; padding: 1px 9px; border-radius: 999px; background: #e7e2d2; color: #4d4630; }
  .chip.cheap { background: #d6ecdc; color: #1f5a35; } .chip.high { background: #f6dccf; color: #8a3414; }
  .cargo { margin: 6px 0 10px; } .bar { height: 12px; background: #e5dec6; border-radius: 6px; overflow: hidden; border: 1px solid #cdc29f; } .fill { height: 100%; background: var(--indigo2); }
  .mt { display: grid; grid-template-columns: 1.35fr 1.2fr .95fr 2.1fr; gap: 0 8px; align-items: center; }
  .mt > div { padding: 7px 4px; border-bottom: 1px solid #ece4cd; } .mh { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: bold; border-bottom: 2px solid var(--line) !important; }
  .mname { display: flex; gap: 8px; align-items: center; } .emo { font-size: 1.5rem; } .mprice strong, .mhave strong { font-size: 1.15rem; }
  .mbtn { display: flex; flex-wrap: wrap; gap: 4px; }
  @media (max-width: 760px) { .mt { grid-template-columns: 1fr 1fr; } }
  .choices { display: grid; gap: 8px; margin: 10px 0; }
  .choice { font: inherit; text-align: left; padding: 12px 16px; border-radius: 10px; border: 2px solid var(--indigo2); background: #fff; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 50px; }
  .choice:hover:not(:disabled) { background: #eef2fa; } .choice span { font-size: .9rem; color: var(--muted); }
  .choice.right { background: #d9efdf; border-color: var(--good); opacity: 1; } .choice.wrong { background: #f7dfd6; border-color: var(--bad); opacity: 1; } .choice.dim { opacity: .5; } .choice:disabled { cursor: default; }
  .feedback { padding: 10px 14px; border-radius: 8px; } .feedback.ok { background: #e4efe6; } .feedback.no { background: #fbeee0; }
  .report { margin: 0 0 10px; padding-left: 20px; color: var(--bad); font-weight: bold; }
  .windbox { border-radius: 10px; padding: 12px 16px; margin: 10px 0; } .windbox.good { background: #e2f0e6; border: 1px solid #b4d4be; } .windbox.bad { background: #fbeee0; border: 1px solid #e9c8a6; }
  .homes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin: 10px 0 18px; }
  .homecard { font: inherit; text-align: left; padding: 14px 16px; border-radius: 12px; border: 2px solid var(--indigo2); background: #fff; color: var(--ink); cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
  .homecard strong { font-family: var(--head); font-size: 1.3rem; color: var(--indigo); } .homecard span { font-size: .92rem; } .homecard:hover { background: #eef2fa; }
  .results { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; } .results > div { background: #f6f1e0; border-radius: 10px; padding: 12px 16px; }
  .big { font-size: 1.7rem; letter-spacing: 3px; color: var(--gold-dk); margin: 0 0 4px; } .think li { margin-bottom: .5em; }
  .overlay { position: fixed; inset: 0; background: rgba(25, 30, 45, .6); display: flex; align-items: flex-start; justify-content: center; padding: 3vh 14px; overflow: auto; z-index: 20; }
  .sheet { background: var(--card); border-radius: 14px; max-width: 760px; width: 100%; padding: 22px 26px 26px; position: relative; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .closebtn { position: sticky; float: right; top: 0; } .entry { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; } .entry.idea { background: #fbf4df; border-radius: 8px; padding: 10px 14px; }
  dt { font-weight: bold; margin-top: .6em; } dd { margin: 0 0 0 1em; }

  /* Market screen: header, map, and destinations stay put; goods scroll on their own */
  .cols { grid-template-rows: auto; }
  .right .card.nopad { padding: 0; } .mkthead { position: sticky; top: 0; z-index: 3; background: var(--card); padding: 12px 18px 8px; border-bottom: 2px solid var(--line); border-radius: 12px 12px 0 0; }
  .mkthead h2 { margin-bottom: .1em; } .mkthead p { margin-bottom: .3em; } .coinsline { color: var(--gold-dk); font-size: 1.1rem; }
  .reserve { font-size: .85rem; color: var(--muted); margin: 6px 0 0; } .right .mt { padding: 0 18px; } .mktfoot { padding: 6px 18px 14px; margin: 0; }
  .want { flex-basis: 100%; font-size: .8rem; color: var(--gold-dk); font-weight: normal; }
  @media (min-width: 1001px) and (min-height: 560px) {
    #app.fixed { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    #app.fixed .status, #app.fixed .banner { flex: none; margin-top: 0; margin-bottom: 8px; }
    #app.fixed .cols { flex: 1 1 auto; min-height: 0; grid-template-rows: minmax(0, 1fr); align-items: stretch; }
    #app.fixed .left, #app.fixed .right { min-height: 0; overflow-y: auto; padding-right: 4px; }
    #app.fixed .card { margin: 0 0 10px; }
    #app.fixed .trips { grid-template-columns: 1fr 1fr; }
    #app.fixed .map { max-height: 34vh; }
  }
  .gtable { display: grid; grid-template-columns: 1.4fr repeat(9, 1fr); gap: 2px; margin: 10px 0; font-size: .78rem; }
  .gtable > div { padding: 4px 3px; text-align: center; border-radius: 4px; } .gh { font-size: 1.15rem; } .gh small { font-size: .62rem; }
  .gc { text-align: left !important; font-weight: bold; font-size: .85rem; align-self: center; }
  .gx { background: #f2ecd9; } .gx.cheap { background: #d6ecdc; color: #1f5a35; font-weight: bold; } .gx.high { background: #f6dccf; color: #8a3414; font-weight: bold; } .gx.q { background: #e9e9e9; color: #888; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="app"></main>
<noscript>This game needs JavaScript turned on.</noscript>
<script src="mapdata.js"></script>
<script src="data.js"></script>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
